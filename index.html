<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HSCBS Font Banner</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #2a1a2a;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 2rem;
  }
  h1 { margin-bottom: 0.5rem; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: flex-end;
    justify-content: center;
    margin: 1rem 0;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  label { font-size: 0.85rem; color: #ccc; }
  textarea {
    font-size: 1.1rem;
    padding: 0.5rem 0.8rem;
    border: 2px solid #666;
    border-radius: 6px;
    background: #111;
    color: #fff;
    font-family: inherit;
    width: 480px;
    height: 100px;
    resize: vertical;
  }
  input[type="color"] {
    width: 60px;
    height: 36px;
    border: none;
    background: none;
    cursor: pointer;
  }
  button {
    font-size: 1.1rem;
    padding: 0.6rem 1.2rem;
    background: #c94;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: #000;
  }
  button:hover { background: #eac; }
  #output {
    margin-top: 1rem;
    background: #111;
    border: 4px solid #333;
    max-width: 95vw;
    overflow-x: auto;
  }
  canvas { display: block; image-rendering: pixelated; }
  .hint {
    font-size: 0.85rem;
    color: #aaa;
    margin-top: 0.5rem;
    text-align: center;
    max-width: 640px;
    line-height: 1.4;
  }
  .missing { color: #f66; font-size: 0.9rem; margin-top: 0.5rem; }
</style>
</head>
<body>
  <h1>HSCBS Font Banner</h1>
  <p>Enter text. Use <code>[fill,border]</code> to change colors from that point onward.</p>
  
  <div class="controls">
    <div class="control-group">
      <label for="textInput">Text</label>
      <textarea id="textInput" placeholder="Enter text...">OaK fLAtS</textarea>
    </div>
    <div class="control-group">
      <label for="fillColor">Default fill</label>
      <input type="color" id="fillColor" value="#FFFFFF">
    </div>
    <div class="control-group">
      <label for="borderColor">Default border</label>
      <input type="color" id="borderColor" value="#000000">
    </div>
    <div class="control-group">
      <label for="bgColor">Background</label>
      <input type="color" id="bgColor" value="#1a1a1a">
    </div>
    <button id="renderBtn">Render</button>
    <button id="downloadBtn">Download PNG</button>
  </div>
  
  <div id="missing" class="missing"></div>
  <div class="hint">
    Color tags: <code>[red,black]</code> or <code>[#ff0000,#00ff00]</code> or CSS names. Applies from that point on.<br>
    Case-insensitive for letters that only have one case. Multi-line supported.<br>
    Pixel data from pixelfont.json.
  </div>
  
  <div id="output">
    <canvas id="canvas"></canvas>
  </div>

<script>
const JSON_URL = 'https://raw.githubusercontent.com/waxmotson/hscbs-font/main/pixelfont.json';

let fontData = null;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const textInput = document.getElementById('textInput');
const fillInput = document.getElementById('fillColor');
const borderInput = document.getElementById('borderColor');
const bgInput = document.getElementById('bgColor');
const missingEl = document.getElementById('missing');

// Letters that have both cases
const dualCase = new Set(['A','E','F','G','H','I','M','N','T']);

function resolveChar(ch) {
  if (fontData[ch]) return ch;
  const upper = ch.toUpperCase();
  const lower = ch.toLowerCase();
  if (fontData[upper] && !dualCase.has(upper)) return upper;
  if (fontData[lower] && !dualCase.has(upper)) return lower;
  if (fontData[upper]) return upper;
  if (fontData[lower]) return lower;
  return null;
}

function parseColor(str) {
  str = str.trim().toLowerCase();
  if (!str) return null;
  // hex
  if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(str)) {
    if (str.length === 4) {
      return '#' + str[1]+str[1] + str[2]+str[2] + str[3]+str[3];
    }
    return str;
  }
  // try CSS named color via canvas
  const c = document.createElement('canvas');
  const cx = c.getContext('2d');
  cx.fillStyle = str;
  const resolved = cx.fillStyle;
  if (resolved && resolved !== 'rgba(0, 0, 0, 0)' && resolved !== str) {
    // convert to hex if possible
    if (resolved.startsWith('rgb')) {
      const m = resolved.match(/(\d+)/g);
      if (m && m.length >= 3) {
        return '#' + m.slice(0,3).map(n => parseInt(n).toString(16).padStart(2,'0')).join('');
      }
    }
    return resolved;
  }
  // fallback: if it looks like a name, still try
  return str.startsWith('#') ? str : null;
}

function hexToRgb(hex) {
  if (!hex || !hex.startsWith('#')) return {r:255,g:255,b:255};
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

async function loadFont() {
  if (fontData) return;
  const res = await fetch(JSON_URL);
  fontData = await res.json();
}

function renderGlyph(ch, fillHex, borderHex, pixelSize) {
  const data = fontData[ch];
  if (!data) return null;
  const fillRows = data.fill;
  const borderRows = data.border;
  const h = fillRows.length;
  const w = fillRows[0].length;
  const temp = document.createElement('canvas');
  temp.width = w * pixelSize;
  temp.height = h * pixelSize;
  const tctx = temp.getContext('2d');
  const fill = hexToRgb(fillHex);
  const border = hexToRgb(borderHex);

  for (let y = 0; y < h; y++) {
    const frow = fillRows[y] || '';
    const brow = borderRows[y] || '';
    for (let x = 0; x < w; x++) {
      const isFill = frow[x] === '#';
      const isBorder = brow[x] === '#';
      if (isFill) {
        tctx.fillStyle = `rgb(${fill.r},${fill.g},${fill.b})`;
        tctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
      } else if (isBorder) {
        tctx.fillStyle = `rgb(${border.r},${border.g},${border.b})`;
        tctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
      }
      // else transparent
    }
  }
  return temp;
}

async function renderBanner() {
  await loadFont();
  const raw = textInput.value;
  const defaultFill = fillInput.value;
  const defaultBorder = borderInput.value;
  const bgColor = bgInput.value;
  missingEl.textContent = '';

  // Parse text with color tags
  const lines = raw.split('\n');
  const allMissing = new Set();
  const renderedLines = [];

  let currentFill = defaultFill;
  let currentBorder = defaultBorder;

  for (const line of lines) {
    const glyphs = [];
    let i = 0;
    while (i < line.length) {
      if (line[i] === '[') {
        const end = line.indexOf(']', i);
        if (end !== -1) {
          const inside = line.slice(i + 1, end);
          const parts = inside.split(',').map(s => s.trim());
          if (parts.length >= 1 && parts[0]) {
            const f = parseColor(parts[0]);
            if (f) currentFill = f;
          }
          if (parts.length >= 2 && parts[1]) {
            const b = parseColor(parts[1]);
            if (b) currentBorder = b;
          }
          i = end + 1;
          continue;
        }
      }
      const ch = line[i];
      if (ch === ' ') {
        glyphs.push({ type: 'space' });
      } else {
        const resolved = resolveChar(ch);
        if (resolved) {
          glyphs.push({
            type: 'char',
            ch: resolved,
            fill: currentFill,
            border: currentBorder
          });
        } else {
          allMissing.add(ch);
          glyphs.push({ type: 'missing' });
        }
      }
      i++;
    }
    renderedLines.push(glyphs);
  }

  if (allMissing.size) {
    missingEl.textContent = 'Missing / unsupported: ' + [...allMissing].join(' ');
  }

  const pixelSize = 8; // scale factor for 16x16 glyphs
  const glyphH = 16 * pixelSize;
  const spaceW = 8 * pixelSize;
  const gap = 2;
  const lineGap = 16;
  const pad = 16;

  // Measure
  let maxW = 0;
  for (const glyphs of renderedLines) {
    let w = pad * 2;
    for (const g of glyphs) {
      if (g.type === 'space') w += spaceW + gap;
      else if (g.type === 'char') {
        const data = fontData[g.ch];
        const gw = (data.fill[0].length) * pixelSize;
        w += gw + gap;
      } else w += spaceW + gap;
    }
    maxW = Math.max(maxW, w);
  }
  const totalH = renderedLines.length * (glyphH + lineGap) + pad * 2 - lineGap;

  canvas.width = Math.max(maxW, 100);
  canvas.height = Math.max(totalH, 50);

  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let y = pad;
  for (const glyphs of renderedLines) {
    let x = pad;
    for (const g of glyphs) {
      if (g.type === 'char') {
        const glyphCanvas = renderGlyph(g.ch, g.fill, g.border, pixelSize);
        if (glyphCanvas) {
          ctx.drawImage(glyphCanvas, x, y);
          x += glyphCanvas.width + gap;
        }
      } else if (g.type === 'space') {
        x += spaceW + gap;
      } else {
        x += spaceW + gap;
      }
    }
    y += glyphH + lineGap;
  }
}

document.getElementById('renderBtn').addEventListener('click', renderBanner);
document.getElementById('downloadBtn').addEventListener('click', () => {
  let name = textInput.value
    .replace(/\[.*?\]/g, '')
    .replace(/[^a-zA-Z0-9 \-_]/g, '')
    .trim()
    .replace(/\s+/g, '_')
    .slice(0, 60) || 'banner';
  const link = document.createElement('a');
  link.download = name + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) renderBanner();
});

// Initial
loadFont().then(renderBanner);
</script>
</body>
</html>
